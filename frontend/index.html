<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#EFEFEF" />
		<meta name="description" content="DavidFLIX — browse trending movies and TV shows, watch trailers, and find something to watch tonight." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,100..800&family=Pacifico&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block"
		/>
		<title>DavidFLIX</title>
		<script>
			// Apply the saved theme before first paint. Light is the default.
			try {
				if (localStorage.getItem("davidflix-theme") === "dark") {
					document.documentElement.classList.add("iwd-dark");
					document.querySelector('meta[name="theme-color"]').setAttribute("content", "#082139");
				}
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
